# Experiment Configuration: Unity ML-Agents Crawler (Complex Continuous Locomotion)
project_name: "production-rl-pipeline"
experiment_name: "default_crawler_ppo"
seed: 42

env:
  backend: "unity"
  binary_path: "binaries/Startup/Startup.x86_64"
  scene_name: "Assets/ML-Agents/Examples/Crawler/Scenes/Crawler.unity"
  time_scale: 20.0
  no_graphics: true
  base_port: 5050
  norm_obs: true       # Continuous joint angles, angular velocities, and body velocities require normalization
  norm_reward: true    # Dense continuous locomotion rewards benefit from variance normalization
  clip_obs: 10.0
  clip_reward: 10.0

algorithm:
  name: "PPO"
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 128
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001     # Low entropy coefficient for stable continuous Gaussian policy
  vf_coef: 0.5
  max_grad_norm: 0.5

train:
  total_timesteps: 2000000
  save_freq: 100000
  eval_freq: 50000
  eval_episodes: 16
  enable_eval: true
  enable_wandb: true
